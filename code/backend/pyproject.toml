[project]
name = "lookcoach-backend"
version = "0.4.0"
description = "LookCoach - evidence-based looks optimization module of Personal AI OS"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Line length
line-length = 100

# Target Python version
target-version = "py312"

# Files to include/exclude
include = ["*.py"]
exclude = [
    ".venv*",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E402",
    "F401",
    "F811",
    "F841",
    "E722",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
[tool.mypy]
# Plan 7.1 - run from code/: python -m mypy --config-file backend/pyproject.toml
# Checked step by step - modules written/rewritten in plan 2026-11-01 first.
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
files = [
    "backend/paths.py",
    "backend/security.py",
    "backend/services/outbox.py",
    "backend/services/goal_router.py",
    "backend/services/ecosystem_dispatch.py",
    "backend/services/ecosystem_client.py",
    "backend/services/state_labels.py",
    "backend/services/lifestyle_status.py",
    "backend/services/photo_storage.py",
    "backend/services/wellbeing_guard.py",
    "backend/services/correlations.py",
    "backend/services/style_advisor.py",
    "backend/services/style_preview.py",
    "backend/services/barcode_lookup.py",
    "backend/services/assistant.py",
    "backend/services/data_privacy.py",
]
