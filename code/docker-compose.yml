networks:
  lookcoach-network:
    driver: bridge

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lookcoach-backend
    ports:
      - "8010:8010"
    volumes:
      - ./backend:/app/backend
      - uploads:/app/backend/uploads
    environment:
      - DATABASE_URL=sqlite:///./looks_optimizer.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - ../.env
    networks:
      - lookcoach-network
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8010 --reload
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lookcoach-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8010
    networks:
      - lookcoach-network
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: lookcoach-ollama
    ports:
      - "11437:11434"
    volumes:
      - ollama-data:/usr/share/ollama
    networks:
      - lookcoach-network
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
    # Pull a default model on first run (optional)
    # command: serve

volumes:
  uploads:
  ollama-data: