name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            code/backend/requirements.txt
            code/requirements-dev.txt
      - name: Zależności
        run: pip install -r requirements.txt pytest==8.3.3 pytest-asyncio==0.24.0 ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Testy
        run: python -m pytest tests/ -q
      - name: mypy (moduły z planu 2026-11-01)
        working-directory: code
        run: python -m mypy --config-file backend/pyproject.toml
      - name: Brama rzetelności dowodów (LC-1)
        working-directory: code
        run: python -m backend.scripts.verify_evidence_db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Testy
        run: npm test -- --run
      - name: Build
        run: npm run build
